[tool.ruff]
line-length = 88
target-version = "py313"

exclude = [
    "manage.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"